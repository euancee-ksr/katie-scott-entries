name: Update Katie Scott Entries

on:
  workflow_dispatch:

  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Scrape Katie Scott entries
        run: |
          python scrape_entries.py

      - name: Show results
        run: |
          cat entries.json

      - name: Save updated entries
        run: |

          git config user.name \
            "Katie Scott Entries Bot"

          git config user.email \
            "actions@users.noreply.github.com"

          git add entries.json

          git diff --cached \
            --quiet \
            || git commit \
            -m "Update Katie Scott entries"

          git push
